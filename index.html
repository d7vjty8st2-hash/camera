<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LH Cam">
<title>LH Cam</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #view { width: 100%; height: 100%; object-fit: cover; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(#0008, transparent); z-index: 5; }
  #brand { font-size: 13px; letter-spacing: 3px; opacity: .9; }
  #flip { background: #fff2; border: 0; color: #fff; padding: 8px 14px; border-radius: 18px; font-size: 14px; }
  #bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 18px); background: linear-gradient(transparent, #000a); z-index: 5; }
  #filters { display: flex; justify-content: center; gap: 28px; margin-bottom: 16px; }
  .f { background: none; border: 0; color: #fff9; font-size: 15px; letter-spacing: 2px; padding: 6px 4px; border-bottom: 2px solid transparent; }
  .f.on { color: #fff; border-bottom-color: #e4002b; }
  #row { display: flex; align-items: center; justify-content: space-between; }
  #thumb { width: 52px; height: 52px; border-radius: 10px; background: #222 center/cover; border: 1px solid #fff4; }
  #shot { width: 74px; height: 74px; border-radius: 50%; background: #fff; border: 5px solid #000; box-shadow: 0 0 0 3px #fff; }
  #shot:active { transform: scale(.92); }
  #spacer { width: 52px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .25s; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 8; background: #000; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<video id="vid" playsinline muted autoplay style="display:none"></video>
<div id="top"><div id="brand">LEICA · HASSELBLAD</div><button id="flip">翻转</button></div>
<div id="bottom">
  <div id="filters">
    <button class="f on" data-k="leica">徕卡</button>
    <button class="f" data-k="hassel">哈苏</button>
    <button class="f" data-k="none">原图</button>
  </div>
  <div id="row"><div id="thumb"></div><button id="shot" aria-label="拍照"></button><div id="spacer"></div></div>
</div>
<div id="flash"></div>
<div id="msg"></div>
<script>
const vid = document.getElementById('vid');
const view = document.getElementById('view');
const ctx = view.getContext('2d', { willReadFrequently: true });
const msg = document.getElementById('msg');
let facing = 'environment';
let current = 'leica';
let stream = null;

// 每个滤镜的参数
const LOOKS = {
  none: null,
  leica: {
    // 徕卡:偏暖、对比高、暗部压深、高光柔和、绿偏橄榄、红浓郁
    contrast: 1.18, brightness: 0.0, saturation: 1.05,
    warm: [1.06, 1.0, 0.92],       // R G B 增益
    shadows: [0.02, 0.03, 0.04],   // 暗部偏色 (略偏青蓝)
    highlights: [0.03, 0.015, -0.01], // 高光偏色 (略偏暖黄)
    fade: 0.015,                   // 黑位微抬
    vignette: 0.38,
    grain: 0.055
  },
  hassel: {
    // 哈苏:中性干净、肤色通透、层次宽、饱和克制、几乎无暗角颗粒
    contrast: 1.04, brightness: 0.01, saturation: 0.92,
    warm: [1.015, 1.0, 0.985],
    shadows: [0.0, 0.0, 0.006],
    highlights: [0.008, 0.004, 0.0],
    fade: 0.0,
    vignette: 0.06,
    grain: 0.008
  }
};

// S 曲线:压暗部、柔化高光
function curve(x, c) {
  x = (x - 0.5) * c + 0.5;
  return x < 0 ? 0 : x > 1 ? 1 : x;
}
function soft(x) { // 高光柔和滚降
  return x > 0.8 ? 0.8 + (x - 0.8) * 0.72 : x;
}

function applyLook(img, w, h, L) {
  if (!L) return;
  const d = img.data;
  const cx = w / 2, cy = h / 2;
  const maxD = Math.sqrt(cx * cx + cy * cy);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      r *= L.warm[0]; g *= L.warm[1]; b *= L.warm[2];
      r += L.brightness; g += L.brightness; b += L.brightness;
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      // 饱和度
      r = lum + (r - lum) * L.saturation;
      g = lum + (g - lum) * L.saturation;
      b = lum + (b - lum) * L.saturation;
      // 分区调色
      const sh = 1 - Math.min(1, lum * 2);
      const hi = Math.max(0, lum * 2 - 1);
      r += L.shadows[0] * sh + L.highlights[0] * hi;
      g += L.shadows[1] * sh + L.highlights[1] * hi;
      b += L.shadows[2] * sh + L.highlights[2] * hi;
      // 对比度曲线 + 高光滚降
      r = soft(curve(r, L.contrast)); g = soft(curve(g, L.contrast)); b = soft(curve(b, L.contrast));
      // 黑位微抬
      r = L.fade + r * (1 - L.fade); g = L.fade + g * (1 - L.fade); b = L.fade + b * (1 - L.fade);
      // 暗角
      if (L.vignette > 0) {
        const dx = x - cx, dy = y - cy;
        const t = Math.sqrt(dx * dx + dy * dy) / maxD;
        const v = 1 - L.vignette * t * t * 1.4;
        r *= v; g *= v; b *= v;
      }
      // 颗粒
      if (L.grain > 0) {
        const n = (Math.random() - 0.5) * L.grain * 2;
        r += n; g += n; b += n;
      }
      d[i] = Math.max(0, Math.min(255, r * 255));
      d[i + 1] = Math.max(0, Math.min(255, g * 255));
      d[i + 2] = Math.max(0, Math.min(255, b * 255));
    }
  }
}

// 预览用较低分辨率保证流畅
const PREVIEW_W = 480;
function loop() {
  if (vid.videoWidth) {
    const ratio = vid.videoHeight / vid.videoWidth;
    const w = PREVIEW_W, h = Math.round(PREVIEW_W * ratio);
    if (view.width !== w) { view.width = w; view.height = h; }
    ctx.drawImage(vid, 0, 0, w, h);
    const L = LOOKS[current];
    if (L) {
      const img = ctx.getImageData(0, 0, w, h);
      applyLook(img, w, h, L);
      ctx.putImageData(img, 0, 0);
    }
  }
  requestAnimationFrame(loop);
}

async function start() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 } },
      audio: false
    });
    vid.srcObject = stream;
    await vid.play();
    msg.style.display = 'none';
  } catch (e) {
    msg.style.display = 'flex';
    msg.innerHTML = '无法打开相机<br>请确认用 Safari 打开 https 网址,<br>并在设置里允许相机权限。';
  }
}

// 拍照:用视频原始分辨率处理,画质比预览高
function shoot() {
  if (!vid.videoWidth) return;
  const w = vid.videoWidth, h = vid.videoHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cc = c.getContext('2d');
  cc.drawImage(vid, 0, 0, w, h);
  const L = LOOKS[current];
  if (L) {
    const img = cc.getImageData(0, 0, w, h);
    applyLook(img, w, h, L);
    cc.putImageData(img, 0, 0);
  }
  const fl = document.getElementById('flash');
  fl.style.opacity = .85;
  setTimeout(() => fl.style.opacity = 0, 80);
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    document.getElementById('thumb').style.backgroundImage = 'url(' + url + ')';
    const file = new File([blob], 'LH_' + Date.now() + '.jpg', { type: 'image/jpeg' });
    // iPhone:优先调起系统分享面板,可直接「存储图像」到相册
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = url; a.download = file.name; a.click();
    }
  }, 'image/jpeg', 0.95);
}

document.querySelectorAll('.f').forEach(b => b.onclick = () => {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  current = b.dataset.k;
});
document.getElementById('flip').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  start();
};
document.getElementById('shot').onclick = shoot;

start();
loop();
</script>
</body>
</html>
